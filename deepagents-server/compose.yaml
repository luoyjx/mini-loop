name: mini-loop-deepagents
services:
  api:
    build: .
    image: mini-loop-deepagents:0.1.0
    ports:
      - "127.0.0.1:2024:8000"
    env_file: .env
    environment:
      DATABASE_URI: "postgres://postgres:${POSTGRES_PASSWORD:?Set a database password}@postgres:5432/postgres?sslmode=disable"
      REDIS_URI: redis://redis:6379
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:?Licensed Agent Server requires a LangSmith API key}"
      LANGGRAPH_CLOUD_LICENSE_KEY: "${LANGGRAPH_CLOUD_LICENSE_KEY:?Custom auth in standalone Agent Server requires an appropriate license}"
      N_JOBS_PER_WORKER: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 2
    mem_limit: 1g
    stop_grace_period: 60s
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a database password}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 1
    mem_limit: 512m
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    cpus: 1
    mem_limit: 128m
volumes:
  postgres-data:
